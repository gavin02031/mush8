name: Switch2iOS
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  Switch2iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.switch2ios.preview
        PRODUCT_NAME: Switch2iOS
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Switch2iOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Switch2iOS:
    build:
      targets:
        Switch2iOS: all
